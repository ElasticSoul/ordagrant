<script>
/* ==== js/games/ordkedja.js ==== */
/* Ordkedja – varje nytt ord börjar på sista bokstaven i föregående ord */
(function () {
  'use strict';
  const { el } = Hub;
  const CFG = {
    familj: { turn: 25, solo: 90, min: 3, top: 4000, fail: 0.06, grow: 0.04 },
    ungdom: { turn: 18, solo: 75, min: 3, top: 9000, fail: 0.04, grow: 0.03 },
    vuxen:  { turn: 14, solo: 60, min: 4, top: 20000, fail: 0.02, grow: 0.02 },
  };
  const wordPts = (w) => Math.min(25, 5 + Math.max(0, w.length - 3) * 2);
  const up = (w) => w.toLocaleUpperCase('sv-SE');
  Hub.register({
    id: 'ordkedja', title: 'Ordkedja', emoji: '🔗', section: 'ordlek', c1: '#00a6a6', c2: '#3a7bd5',
    desc: 'Nästa ord ska börja på sista bokstaven i förra ordet. Spela mot datorn eller solo mot klockan!',
    mount(root) {
      const self = this; let timer = null, aiT = null;
      const stage = el('div', { class: 'stage' }); root.append(stage);
      let mode = Hub.lsGet('ordagrant:kedjaläge') === 'solo' ? 'solo' : 'dator';
      intro();
      function stop() { clearInterval(timer); clearTimeout(aiT); timer = aiT = null; }
      self._stop = stop;
      function intro() {
        stop();
        const C = CFG[Hub.audience];
        const seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Spelläge' },
          el('button', { type: 'button', 'aria-pressed': String(mode === 'dator'), onclick: () => { mode = 'dator'; Hub.lsSet('ordagrant:kedjaläge', mode); intro(); } }, '🤖 Mot datorn'),
          el('button', { type: 'button', 'aria-pressed': String(mode === 'solo'), onclick: () => { mode = 'solo'; Hub.lsSet('ordagrant:kedjaläge', mode); intro(); } }, '⏱️ Solo mot klockan'));
        stage.replaceChildren(el('div', { class: 'panel center' },
          el('div', { style: { fontSize: '54px' } }, '🔗'),
          el('h2', null, 'Ordkedja'),
          el('p', { class: 'muted' }, mode === 'dator'
            ? `Du och datorn turas om. Du har ${C.turn} sekunder per ord. Den som inte hittar något ord förlorar!`
            : `Bilda en så lång kedja du kan på ${C.solo} sekunder.`),
          el('p', { class: 'muted', style: { fontSize: '14px' } }, `Orden ska ha minst ${C.min} bokstäver, finnas i ordlistan och får inte upprepas. Böjningar som ”bilar” räknas.`),
          el('div', { class: 'row center' }, seg),
          el('div', { class: 'row center', style: { marginTop: '16px' } }, el('button', { class: 'btn primary', onclick: start }, '▶ Starta'))));
      }
      function start() {
        stop();
        const C = CFG[Hub.audience], D = Hub.dict();
        // Startord: vanligt ord vars sista bokstav många ord börjar på
        const okEnd = (w) => (D.byFirst[w[w.length - 1]] || []).length > 400;
        const pool = D.list.slice(0, 3000).filter(w => w.length >= 4 && w.length <= 6 && okEnd(w));
        let first = pool[Hub.rand(pool.length)];
        const used = new Set([first]); const chain = [{ w: first, who: 'start' }];
        let score = 0, mine = 0, turn = 'du', left = mode === 'solo' ? C.solo : C.turn, over = false;
        const chainBox = el('div', { class: 'ok-chain', 'aria-live': 'polite' });
        const need = el('div', { class: 'ok-need' });
        const clock = el('span', { class: 'pill' });
        const pts = el('span', { class: 'pill' });
        const bar = el('i', { style: { width: '100%' } });
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const inp = el('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'send', lang: 'sv', 'aria-label': 'Ditt ord', placeholder: 'Skriv ett ord…' });
        const send = el('button', { class: 'btn primary', type: 'submit' }, 'Skicka');
        const form = el('form', { class: 'ans-form', onsubmit: (e) => { e.preventDefault(); submit(); } }, inp, send);
        const give = el('button', { class: 'btn ghost', type: 'button', onclick: () => end(mode === 'solo' ? 'solo' : 'gaveup') }, mode === 'solo' ? '🏁 Avsluta' : '🏳️ Ge upp');
        stage.replaceChildren(
          el('div', { class: 'row' }, el('span', { class: 'pill warn' }, mode === 'solo' ? '⏱️ Solo' : '🤖 Mot datorn'), el('span', { class: 'spacer' }), clock, pts),
          el('div', { class: 'timer', style: { marginTop: '10px' } }, bar),
          chainBox, need, form, fb, el('div', { class: 'row center' }, give));
        const total = () => mode === 'solo' ? C.solo : C.turn;
        function last() { const w = chain[chain.length - 1].w; return w[w.length - 1]; }
        function draw() {
          chainBox.replaceChildren(...chain.slice(-14).map((c, k, arr) => el('span', { class: 'ok-word ' + c.who + (k === arr.length - 1 ? ' last' : '') },
            up(c.w.slice(0, -1)), el('b', null, up(c.w.slice(-1))))));
          need.replaceChildren(over ? '' : turn === 'du'
            ? el('span', null, 'Ditt ord ska börja på ', el('b', { class: 'ok-letter' }, up(last())))
            : el('span', null, '🤖 Datorn tänker på ett ord på ', el('b', { class: 'ok-letter' }, up(last())), ' …'));
          pts.textContent = `⭐ ${score} p`;
          chainBox.scrollLeft = chainBox.scrollWidth;
        }
        function tickClock() {
          clock.textContent = '⏱️ ' + Math.ceil(Math.max(0, left)) + ' s';
          bar.style.width = Math.max(0, left / total() * 100) + '%'; bar.style.backgroundPosition = (100 - left / total() * 100) + '% 0';
        }
        timer = setInterval(() => {
          if (over || turn !== 'du') return;
          left -= 0.1; tickClock();
          if (left <= 0) end(mode === 'solo' ? 'solo' : 'time');
        }, 100);
        function submit() {
          if (over || turn !== 'du') return;
          const w = inp.value.trim().toLocaleLowerCase('sv-SE').normalize('NFC');
          if (!w) return;
          const bad = (msg) => { fb.className = 'feedback bad'; fb.textContent = msg; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); inp.select(); };
          if (!/^[a-zåäöé]+$/.test(w)) return bad('Bara bokstäver, ett ord i taget.');
          if (w[0] !== last()) return bad(`Ordet måste börja på ${up(last())}.`);
          if (w.length < C.min) return bad(`Minst ${C.min} bokstäver.`);
          if (used.has(w)) return bad(`”${up(w)}” är redan använt.`);
          if (!D.set.has(w)) return bad(`”${up(w)}” finns inte i ordlistan.`);
          used.add(w); chain.push({ w, who: 'du' }); mine++;
          const p = wordPts(w); score += p;
          fb.className = 'feedback ok'; fb.textContent = `+${p} poäng för ${up(w)}`;
          inp.value = '';
          if (mode === 'solo') { draw(); return; }
          turn = 'dator'; inp.disabled = send.disabled = true; draw(); aiMove();
        }
        function aiMove() {
          const L = last();
          let cands = (D.byFirst[L] || []).filter(w => w.length >= C.min && !used.has(w) && D.rank.get(w) < C.top);
          // helst lite längre ord än småord som ”att” och ”var”
          const longer = cands.filter(w => w.length >= 5); if (longer.length >= 3) cands = longer;
          const n = chain.filter(c => c.who === 'dator').length;
          const fails = !cands.length || Math.random() < C.fail + C.grow * n;
          aiT = setTimeout(() => {
            if (over) return;
            if (fails) return end('ai');
            // Vuxen-datorn försöker ibland ge dig en svår slutbokstav
            let pick = cands[Math.floor(Math.pow(Math.random(), 2) * Math.min(cands.length, 300))];
            if (Hub.audience === 'vuxen' && Math.random() < 0.4) {
              const hard = cands.slice(0, 400).sort((a, b) => (D.byFirst[a[a.length - 1]] || []).length - (D.byFirst[b[b.length - 1]] || []).length);
              pick = hard[Math.floor(Math.random() * Math.min(5, hard.length))];
            }
            used.add(pick); chain.push({ w: pick, who: 'dator' });
            turn = 'du'; left = C.turn; inp.disabled = send.disabled = false; tickClock(); draw();
            if (matchMedia('(hover:hover)').matches) inp.focus({ preventScroll: true });
          }, 700 + Math.random() * 900);
        }
        function end(why) {
          if (over) return; over = true; stop(); inp.disabled = send.disabled = give.disabled = true; draw();
          const win = why === 'ai';
          if (win) score += 25;
          const record = Hub.finishRound('ordkedja', score, { words: mine, win });
          const ex = mode === 'dator' && why !== 'ai' ? exampleWord() : null;
          const T = { ai: ['🏆', 'Datorn gav upp – du vann!', `Du bildade ${mine} ord och får 25 bonuspoäng.`],
                      time: ['⏰', 'Tiden tog slut', `Du hann med ${mine} ord.`], gaveup: ['🏳️', 'Du gav upp', `Du bildade ${mine} ord.`],
                      solo: ['⏱️', `${mine} ord i kedjan!`, `Kedjan blev ${chain.length} ord lång.`] }[why];
          setTimeout(() => {
            stage.replaceChildren(
              Hub.resultView({ emoji: T[0], title: T[1], text: T[2] + (ex ? ` Du kunde ha skrivit till exempel ”${up(ex)}”.` : ''), points: score, record, onAgain: start }),
              el('div', { class: 'ok-chain done' }, chain.map(c => el('span', { class: 'ok-word ' + c.who }, up(c.w)))),
              el('div', { class: 'row center' }, el('button', { class: 'btn small ghost', onclick: intro }, '⚙️ Byt läge')));
          }, 400);
        }
        function exampleWord() { const c = (D.byFirst[last()] || []).filter(w => w.length >= C.min && !used.has(w)); return c[0]; }
        tickClock(); draw();
        if (matchMedia('(hover:hover)').matches) inp.focus({ preventScroll: true });
      }
    },
    unmount() { if (this._stop) this._stop(); },
  });
})();

<script>
/* ==== js/games/synonymer.js ==== */
/* Synonymer och motsatser – para ihop ord med samma eller motsatt betydelse */
(function () {
  'use strict';
  const { el } = Hub;
  const BOARDS = 3, PAIRS = 5;
  Hub.register({
    id: 'synonymer', title: 'Synonymer och motsatser', emoji: '🔀', section: 'ordlek', c1: '#7b5cff', c2: '#00a6a6',
    desc: 'Para ihop orden som betyder samma sak – eller tvärtom. Snabbt och utan fel ger mest poäng!',
    mount(root) {
      const self = this; let tick = null;
      const stage = el('div', { class: 'stage' }); root.append(stage);
      self._stop = () => clearInterval(tick);
      let b, score, mistakes, totalMistakes, t0, types;
      start();
      function start() {
        clearInterval(tick);
        b = 0; score = 0; totalMistakes = 0;
        const t = Math.random() < 0.5 ? 'syn' : 'mot'; types = [t, t === 'syn' ? 'mot' : 'syn', t];
        board();
      }
      function pickPairs(typ) {
        const L = Hub.levels(), top = Math.max(...L);
        const pool = DATA.synonymer.filter(p => p.t === typ && L.includes(p.lvl));
        const main = Hub.shuffle(pool.filter(p => p.lvl === top)), rest = Hub.shuffle(pool.filter(p => p.lvl !== top));
        const n = L.length > 1 ? 3 : PAIRS;
        return Hub.shuffle(main.slice(0, n).concat(rest).slice(0, PAIRS)).map(p => Math.random() < 0.5 ? p : { ...p, a: p.b, b: p.a });
      }
      function board() {
        clearInterval(tick);
        const typ = types[b], pairs = pickPairs(typ);
        mistakes = 0; t0 = Date.now();
        let sel = null, done = 0;
        const clock = el('span', { class: 'pill' }, '⏱️ 0:00');
        tick = setInterval(() => { clock.textContent = '⏱️ ' + Hub.fmtTime((Date.now() - t0) / 1000); }, 500);
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const mk = (side) => (p) => el('button', { type: 'button', class: 'sm-word', 'data-pair': p.a + '|' + p.b, 'data-side': side, onclick: (e) => tap(e.currentTarget) }, side === 'L' ? p.a : p.b);
        const colL = el('div', { class: 'sm-col' }, Hub.shuffle(pairs).map(mk('L')));
        const colR = el('div', { class: 'sm-col' }, Hub.shuffle(pairs).map(mk('R')));
        stage.replaceChildren(
          el('div', { class: 'row' }, el('span', { class: 'pill' }, `Omgång ${b + 1} / ${BOARDS}`), el('span', { class: 'spacer' }), clock, el('span', { class: 'pill' }, `⭐ ${score} p`)),
          el('div', { class: 'sm-task ' + typ }, typ === 'syn' ? el('span', null, '🟰 Para ihop ord som betyder ', el('b', null, 'samma sak')) : el('span', null, '↔️ Para ihop ord som är ', el('b', null, 'varandras motsats'))),
          el('div', { class: 'sm-board' }, colL, colR), fb);
        function tap(btn) {
          if (btn.classList.contains('done')) return;
          if (!sel || sel.dataset.side === btn.dataset.side) {
            if (sel) sel.classList.remove('sel');
            if (sel === btn) { sel = null; return; }
            sel = btn; btn.classList.add('sel'); return;
          }
          const a = sel, c = btn; sel = null; a.classList.remove('sel');
          if (a.dataset.pair === c.dataset.pair) {
            a.classList.add('done'); c.classList.add('done'); a.disabled = c.disabled = true; done++;
            const hue = ['h1', 'h2', 'h3', 'h4', 'h5'][done - 1]; a.classList.add(hue); c.classList.add(hue);
            fb.className = 'feedback ok'; fb.textContent = typ === 'syn' ? `Rätt! ${a.textContent} ≈ ${c.textContent}` : `Rätt! ${a.textContent} ↔ ${c.textContent}`;
            if (done === pairs.length) finish();
          } else {
            mistakes++; totalMistakes++;
            [a, c].forEach(x => { x.classList.remove('bad', 'shake'); void x.offsetWidth; x.classList.add('bad', 'shake'); setTimeout(() => x.classList.remove('bad'), 600); });
            fb.className = 'feedback bad'; fb.textContent = 'De passar inte ihop – försök igen.';
          }
        }
        function finish() {
          clearInterval(tick);
          const sec = (Date.now() - t0) / 1000;
          const pts = Math.max(10, PAIRS * 10 - mistakes * 4 + Math.round(Math.max(0, 40 - sec) / 2));
          score += pts;
          const last = b === BOARDS - 1;
          fb.className = 'feedback ok'; fb.textContent = `Klart på ${Hub.fmtTime(sec)} med ${mistakes} fel: +${pts} poäng`;
          const nb = el('button', { class: 'btn primary', onclick: () => { if (last) end(); else { b++; board(); } } }, last ? 'Se resultat 🏁' : 'Nästa omgång →');
          stage.append(el('div', { class: 'row center' }, nb)); nb.focus({ preventScroll: true });
        }
      }
      function end() {
        const record = Hub.finishRound('synonymer', score, { mistakes: totalMistakes });
        stage.replaceChildren(Hub.resultView({ emoji: totalMistakes === 0 ? '🌟' : '🔀', title: totalMistakes === 0 ? 'Felfritt!' : `${totalMistakes} fel totalt`, text: `${BOARDS * PAIRS} par hittade.`, points: score, record, onAgain: start }));
      }
    },
    unmount() { if (this._stop) this._stop(); },
  });
})();

        const word = el('div', { class: 'bb-word', 'aria-live': 'polite' });
        const hive = el('div', { class: 'bb-hive', role: 'group', 'aria-label': 'Bokstäver' });

        const list = el('div', { class: 'bb-found' });
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const btns = el('div', { class: 'row center' },
          el('button', { class: 'btn', type: 'button', onclick: back }, '⌫ Radera'),

        const extra = el('div', { class: 'row center', style: { marginTop: '12px' } },
          mode === 'fri' ? el('button', { class: 'btn small', type: 'button', onclick: () => { st.free = Hub.rand(DATA.bokstav.length); Hub.save(); show(); } }, '🎲 Nytt pussel') : null,
          el('button', { class: 'btn small ghost', type: 'button', disabled: revealed, onclick: reveal }, '👀 Visa alla ord'));
        stage.replaceChildren(el('div', { class: 'row center' }, seg),
          el('p', { class: 'muted center', style: { margin: '8px 0 0', fontSize: '14px' } }, `Ord med minst ${I.min} bokstäver som innehåller den gula mittenbokstaven. Bokstäver får användas flera gånger. Ett ord använder alla sju!`),

        function drawHive() {

          rankEl.replaceChildren(el('div', { class: 'row' }, el('b', null, '🐝 ' + r), el('span', { class: 'spacer' }), el('span', { class: 'pill' }, `${found.length} / ${I.words.length} ord`), el('span', { class: 'pill' }, `⭐ ${s} / ${I.max} p`)),
            el('div', { class: 'timer bb-prog' }, el('i', { style: { width: (f * 100) + '%' } })));
          list.replaceChildren(...(revealed ? I.words : found.slice().sort((a, b) => a.localeCompare(b, 'sv'))).map(w =>
            el('span', { class: (found.includes(w) ? 'f' : 'miss') + (I.isPan(w) ? ' pan' : '') }, w)));
        }

        function bad(msg) { fb.className = 'feedback bad'; fb.textContent = msg; word.classList.remove('shake'); void word.offsetWidth; word.classList.add('shake'); setTimeout(() => { cur = ''; drawWord(); }, 500); }

          if (pan) Hub.confetti(60);

          Hub.emit({ type: 'event', id: 'bokstav', info: { found: found.length, daily: mode === 'dag' } });

        async function reveal() {
          if (!(await Hub.confirm('Visa alla ord?', 'Alla ord i pusslet visas. Du kan inte längre få poäng för det här pusslet.', 'Visa'))) return;

        };

      }
      const onKey = (e) => stage._key && stage._key(e);

      this._stop = () => document.removeEventListener('keydown', onKey);
    },

<script>
/* ==== js/games/kopplingen.js ==== */
/* Kopplingen – dela upp 16 ord i 4 grupper om 4 */
(function () {
  'use strict';
  const { el } = Hub;
  const LIVES = 4;
  const fs = (w) => w.length <= 6 ? '' : w.length <= 8 ? 'm' : w.length <= 11 ? 's' : 'xs';
  Hub.register({
    id: 'kopplingen', title: 'Kopplingen', emoji: '🧩', section: 'kunskap', c1: '#16b17e', c2: '#7b5cff',
    desc: '16 ord, fyra hemliga grupper. Hitta vilka fyra ord som hör ihop – du får bara göra fyra misstag.',
    progress: () => { const l = Hub.forAudience(DATA.kopplingen); return { done: l.filter(x => Hub.isSolved('kopplingen', x.id)).length, of: l.length }; },
    mount(root) {
      const stage = el('div', { class: 'stage' }); root.append(stage);
      let last = null;
      start();
      function start() {
        const pool = Hub.forAudience(DATA.kopplingen).filter(p => p !== last);
        const fresh = pool.filter(p => !Hub.isSolved('kopplingen', p.id));
        const P = (fresh.length ? fresh : pool)[Hub.rand((fresh.length ? fresh : pool).length)]; last = P;
        const first = !Hub.isSolved('kopplingen', P.id);
        const groupOf = {}; P.g.forEach((g, k) => g.w.forEach(w => { groupOf[w] = k; }));
        let words = Hub.shuffle(P.g.flatMap(g => g.w)), sel = new Set(), solved = [], lives = LIVES, tried = new Set(), over = false;
        const solvedBox = el('div', { class: 'kp-solved' });
        const grid = el('div', { class: 'kp-grid', role: 'group', 'aria-label': 'Ord' });
        const livesEl = el('div', { class: 'kp-lives', 'aria-live': 'polite' });
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const sendB = el('button', { class: 'btn primary', type: 'button', onclick: submit }, '✔ Skicka');
        const clearB = el('button', { class: 'btn', type: 'button', onclick: () => { sel.clear(); draw(); } }, 'Avmarkera');
        const mixB = el('button', { class: 'btn', type: 'button', onclick: () => { words = Hub.shuffle(words); draw(); } }, '🔀 Blanda');
        const ctrl = el('div', { class: 'row center' }, mixB, clearB, sendB);
        stage.replaceChildren(el('p', { class: 'muted center', style: { margin: '0 0 10px' } }, 'Markera fyra ord som har något gemensamt och tryck på Skicka.'), solvedBox, grid, livesEl, fb, ctrl);
        function draw() {
          solvedBox.replaceChildren(...solved.map(k => el('div', { class: 'kp-group c' + k }, el('b', null, P.g[k].n), el('span', null, P.g[k].w.join(', ')))));
          const rest = words.filter(w => !solved.includes(groupOf[w]));
          grid.replaceChildren(...rest.map(w => el('button', { type: 'button', class: 'kp-word ' + fs(w) + (sel.has(w) ? ' sel' : ''), 'aria-pressed': String(sel.has(w)), disabled: over, onclick: () => toggle(w) }, w)));
          livesEl.replaceChildren('Misstag kvar: ', ...Array.from({ length: LIVES }, (_, k) => el('i', { class: k < lives ? 'on' : '' })));
          sendB.disabled = sel.size !== 4 || over; clearB.disabled = !sel.size || over; mixB.disabled = over;
        }
        function toggle(w) { if (over) return; if (sel.has(w)) sel.delete(w); else if (sel.size < 4) sel.add(w); fb.textContent = ''; draw(); }
        function submit() {
          if (sel.size !== 4 || over) return;
          const key = [...sel].sort().join('|');
          if (tried.has(key)) { fb.className = 'feedback info'; fb.textContent = 'Den kombinationen har du redan provat.'; return; }
          tried.add(key);
          const counts = {}; sel.forEach(w => { counts[groupOf[w]] = (counts[groupOf[w]] || 0) + 1; });
          const best = Math.max(...Object.values(counts));
          if (best === 4) {
            solved.push(groupOf[[...sel][0]]); sel.clear();
            fb.className = 'feedback ok'; fb.textContent = 'Rätt grupp: ' + P.g[solved[solved.length - 1]].n + '!';
            if (solved.length === 3) { const k = [0, 1, 2, 3].find(x => !solved.includes(x)); solved.push(k); }
            draw(); if (solved.length === 4) finish(true);
          } else {
            lives--;
            fb.className = 'feedback bad'; fb.textContent = best === 3 ? 'Nästan – ett ord är fel!' : 'Inte en grupp.';
            grid.querySelectorAll('.sel').forEach(b => { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); });
            setTimeout(() => { draw(); if (lives <= 0) finish(false); }, 420);
            livesEl.classList.remove('shake'); void livesEl.offsetWidth; livesEl.classList.add('shake');
          }
        }
        function finish(win) {
          over = true;
          if (!win) { for (let k = 0; k < 4; k++) if (!solved.includes(k)) solved.push(k); sel.clear(); }
          draw();
          let pts = 0;
          if (win) { pts = 40 + lives * 15; if (!first) pts = Math.round(pts / 2); Hub.markSolved('kopplingen', P.id); }
          const record = Hub.finishRound('kopplingen', pts, { win });
          setTimeout(() => {
            stage.append(Hub.resultView({ emoji: win ? (lives === LIVES ? '🌟' : '🧩') : '😅', title: win ? (lives === LIVES ? 'Perfekt – inga misstag!' : `Klart med ${LIVES - lives} ${LIVES - lives === 1 ? 'misstag' : 'misstag'}`) : 'Misstagen tog slut',
              text: win ? (first ? '' : 'Det här pusslet hade du redan löst, så det ger halva poängen.') : 'Här ovanför ser du alla fyra grupper.', points: pts, record, onAgain: start }));
            ctrl.remove();
          }, 450);
        }
        draw();
        
      }
    },
  });
})();

</script>
<script>
/* ==== js/games/santfalskt.js ==== */
/* Sant eller falskt – snabba påståenden mot klockan */
(function () {
  'use strict';
  const { el } = Hub;
  const ROUND = 10, TIME = { familj: 15, ungdom: 10, vuxen: 8 };
  Hub.register({
    id: 'santfalskt', title: 'Sant eller falskt', emoji: '⚖️', section: 'kunskap', c1: '#16b17e', c2: '#ef4656',
    desc: 'Stämmer påståendet eller inte? Svara snabbt – tiden tickar! Varje svar förklaras.',
    progress: () => { const l = Hub.forAudience(DATA.santfalskt); return { done: l.filter(x => Hub.isSolved('santfalskt', x.id)).length, of: l.length }; },
    mount(root) {
      const self = this; let tick = null;
      const stage = el('div', { class: 'stage' }); root.append(stage);
      self._stop = () => { clearInterval(tick); document.removeEventListener('keydown', onKey); };
      let list, i, score, correct, streak, left, locked, answer;
      const onKey = (e) => { if (!answer || locked) return; const k = e.key.toLowerCase(); if (k === 's' || e.key === 'ArrowLeft') answer(true); else if (k === 'f' || e.key === 'ArrowRight') answer(false); };
      document.addEventListener('keydown', onKey);
      intro();
      function intro() {
        const T = TIME[Hub.audience];
        stage.replaceChildren(el('div', { class: 'panel center' },
          el('div', { style: { fontSize: '54px' } }, '⚖️'), el('h2', null, 'Sant eller falskt?'),
          el('p', { class: 'muted' }, `${ROUND} påståenden. Du har ${T} sekunder på dig för varje. 10 poäng per rätt svar plus tidsbonus – och extra poäng när du har flera rätt i rad.`),
          el('div', { class: 'row center' }, el('button', { class: 'btn primary', onclick: start }, '▶ Starta'))));
      }
      function start() {
        const L = Hub.levels(), top = Math.max(...L);
        const pick = (arr) => { const fresh = Hub.shuffle(arr.filter(x => !Hub.isSolved('santfalskt', x.id))), old = Hub.shuffle(arr.filter(x => Hub.isSolved('santfalskt', x.id))); return fresh.concat(old); };
        const main = pick(DATA.santfalskt.filter(x => x.lvl === top)), rest = pick(DATA.santfalskt.filter(x => L.includes(x.lvl) && x.lvl !== top));
        const nMain = L.length > 1 ? 7 : ROUND;
        list = Hub.shuffle(main.slice(0, nMain).concat(rest.slice(0, ROUND - Math.min(nMain, main.length))));
        i = 0; score = 0; correct = 0; streak = 0; show();
      }
      function show() {
        clearInterval(tick); locked = false;
        const it = list[i], T = TIME[Hub.audience];
        const bar = el('i', { style: { width: '100%' } });
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const next = el('div', { class: 'row center', style: { marginTop: '10px' } });
        const bT = el('button', { type: 'button', class: 'sf-btn sant', onclick: () => answer(true) }, el('span', null, '✔'), 'Sant');
        const bF = el('button', { type: 'button', class: 'sf-btn falskt', onclick: () => answer(false) }, el('span', null, '✘'), 'Falskt');
        const card = el('div', { class: 'sf-card' }, it.s);
        stage.replaceChildren(
          el('div', { class: 'row' }, el('span', { class: 'pill' }, `${i + 1} / ${list.length}`), streak > 1 ? el('span', { class: 'pill warn' }, `🔥 ${streak} i rad`) : null, el('span', { class: 'spacer' }), el('span', { class: 'pill' }, `⭐ ${score} p`)),
          el('div', { class: 'timer', style: { marginTop: '12px' } }, bar), card,
          el('div', { class: 'sf-btns' }, bT, bF), fb, next);
        left = T;
        tick = setInterval(() => { left -= 0.1; bar.style.width = Math.max(0, left / T * 100) + '%'; bar.style.backgroundPosition = (100 - left / T * 100) + '% 0'; if (left <= 0) answer(null); }, 100);
        answer = function (v) {
          if (locked) return; locked = true; clearInterval(tick);
          const ok = v === it.a;
          bT.disabled = bF.disabled = true;
          (it.a ? bT : bF).classList.add('right'); if (v !== null && !ok) (v ? bT : bF).classList.add('wrong');
          card.classList.add(ok ? 'ok' : 'bad');
          if (ok) {

            const bonus = Math.round(Math.max(0, left) / T * 10) + (streak >= 3 ? 5 : 0);
            score += 10 + bonus; Hub.markSolved('santfalskt', it.id);
            fb.className = 'feedback ok'; fb.textContent = `Rätt – det är ${it.a ? 'sant' : 'falskt'}! +${10 + bonus} poäng`;
          } else {
            streak = 0; fb.className = 'feedback bad';
            fb.textContent = (v === null ? 'Tiden tog slut! ' : 'Fel! ') + `Påståendet är ${it.a ? 'sant' : 'falskt'}.`;
          }

          const last = i === list.length - 1;
          const b = el('button', { class: 'btn primary', onclick: () => { if (last) end(); else { i++; show(); } } }, last ? 'Se resultat 🏁' : 'Nästa →');
          next.append(b); b.focus({ preventScroll: true });
        };
      }
      function end() {
        answer = null;
        const record = Hub.finishRound('santfalskt', score, { correct });
        stage.replaceChildren(Hub.resultView({ emoji: correct >= 8 ? '🏆' : '⚖️', title: `${correct} av ${list.length} rätt`, text: correct === list.length ? 'Alla rätt – du vet verkligen vad som är sant!' : correct >= 6 ? 'Snyggt jobbat!' : 'Bra kämpat – nästa gång går det ännu bättre!', points: score, record, onAgain: start }));
      }
    },
    unmount() { if (this._stop) this._stop(); },
  });

<script>
/* ==== js/games/logik.js ==== */
/* Logiktavlan – knäck den hemliga färgkoden (Mastermind) */
(function () {
  'use strict';
  const { el } = Hub;
  // Färgblindvänlig palett (Okabe–Ito) + en symbol per färg
  const COLORS = [
    { n: 'Orange', c: '#E69F00', s: '●' }, { n: 'Himmelsblå', c: '#56B4E9', s: '▲' }, { n: 'Grön', c: '#009E73', s: '■' },
    { n: 'Gul', c: '#F0E442', s: '◆' }, { n: 'Blå', c: '#0072B2', s: '★' }, { n: 'Röd', c: '#D55E00', s: '♥' },
    { n: 'Rosa', c: '#CC79A7', s: '✚' }, { n: 'Grå', c: '#5b5b66', s: '☾' }];
  const CFG = {
    familj: { pegs: 4, colors: 6, dup: false, tries: 10, mult: 1 },
    ungdom: { pegs: 5, colors: 7, dup: false, tries: 10, mult: 1.5 },
    vuxen:  { pegs: 5, colors: 8, dup: true, tries: 12, mult: 2 },
  };
  function score(guess, code) {
    let black = 0; const a = {}, b = {};
    guess.forEach((g, i) => { if (g === code[i]) black++; else { a[g] = (a[g] || 0) + 1; b[code[i]] = (b[code[i]] || 0) + 1; } });
    let white = 0; for (const k in a) white += Math.min(a[k], b[k] || 0);
    return { black, white };
  }
  Hub.mastermindScore = score;
  const peg = (k, extra) => el('span', { class: 'mm-peg' + (extra || ''), style: { '--pc': COLORS[k].c }, title: COLORS[k].n, 'aria-label': COLORS[k].n }, COLORS[k].s);
  Hub.register({
    id: 'logik', title: 'Logiktavlan', emoji: '🎯', section: 'logik', c1: '#0072B2', c2: '#CC79A7',
    desc: 'Knäck den hemliga färgkoden! Ledtrådarna visar hur många som har rätt färg och rätt plats.',
    mount(root) {
      const stage = el('div', { class: 'stage' }); root.append(stage);
      start();
      function start() {
        const C = CFG[Hub.audience];
        let code = [];
        if (C.dup) code = Array.from({ length: C.pegs }, () => Hub.rand(C.colors));
        else code = Hub.shuffle([...Array(C.colors).keys()]).slice(0, C.pegs);
        const rows = []; let cur = [], over = false;
        const board = el('div', { class: 'mm-board' });
        const input = el('div', { class: 'mm-row mm-input', 'aria-label': 'Din gissning' });
        const palette = el('div', { class: 'mm-palette', role: 'group', 'aria-label': 'Färger' },
          COLORS.slice(0, C.colors).map((col, k) => el('button', { type: 'button', class: 'mm-pick', style: { '--pc': col.c }, 'aria-label': col.n, onclick: () => add(k) }, col.s)));
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const guessB = el('button', { class: 'btn primary', type: 'button', onclick: submit }, '✔ Gissa');
        const clearB = el('button', { class: 'btn', type: 'button', onclick: () => { cur = []; draw(); } }, 'Rensa');
        const secret = el('div', { class: 'mm-row mm-secret' });
        stage.replaceChildren(
          el('div', { class: 'row' }, el('span', { class: 'pill' }, `${C.pegs} positioner · ${C.colors} färger`), el('span', { class: 'pill warn' }, C.dup ? 'Färger kan upprepas' : 'Alla färger olika'), el('span', { class: 'spacer' }), el('span', { class: 'pill', id: 'mm-left' })),
          el('details', { class: 'mm-help' }, el('summary', null, 'Hur spelar man?'),
            el('p', null, 'Gissa koden genom att trycka på färgerna. Efter varje gissning får du ledtrådar: ',
              el('span', { class: 'mm-key black' }), ' = rätt färg på rätt plats, ', el('span', { class: 'mm-key white' }), ' = rätt färg men fel plats. Varje färg har också en egen symbol.')),
          secret, board, input, palette, el('div', { class: 'row center', style: { marginTop: '10px' } }, clearB, guessB), fb);
        function feedbackEl(r) {
          return el('div', { class: 'mm-fb', 'aria-label': `${r.black} rätt plats, ${r.white} rätt färg på fel plats` },
            el('div', { class: 'mm-pins' }, ...Array.from({ length: C.pegs }, (_, k) => el('i', { class: k < r.black ? 'black' : k < r.black + r.white ? 'white' : '' }))),
            el('small', null, `✔${r.black} ○${r.white}`));
        }
        function draw() {
          board.replaceChildren(...rows.map((r, n) => el('div', { class: 'mm-row' }, el('span', { class: 'mm-n' }, n + 1), el('div', { class: 'mm-pegs' }, r.g.map(k => peg(k))), feedbackEl(r.r))));
          input.replaceChildren(el('span', { class: 'mm-n' }, over ? '' : rows.length + 1),
            el('div', { class: 'mm-pegs' }, ...Array.from({ length: C.pegs }, (_, i) => cur[i] != null
              ? el('button', { type: 'button', class: 'mm-slot', onclick: () => { cur.splice(i, 1); draw(); }, 'aria-label': `Ta bort ${COLORS[cur[i]].n}` }, peg(cur[i]))
              : el('span', { class: 'mm-slot empty' }))));
          input.style.display = over ? 'none' : '';
          guessB.disabled = cur.length !== C.pegs || over; clearB.disabled = !cur.length || over;
          palette.querySelectorAll('button').forEach((b, k) => { b.disabled = over || (!C.dup && cur.includes(k)); });
          stage.querySelector('#mm-left').textContent = `Gissningar kvar: ${C.tries - rows.length}`;
          secret.replaceChildren(el('span', { class: 'mm-n' }, '🔒'), el('div', { class: 'mm-pegs' }, ...code.map(k => over ? peg(k) : el('span', { class: 'mm-peg hidden' }, '?'))));
        }
        function add(k) { if (over || cur.length >= C.pegs) return; if (!C.dup && cur.includes(k)) return; cur.push(k); draw(); }
        function submit() {
          if (cur.length !== C.pegs || over) return;
          const r = score(cur, code); rows.push({ g: cur.slice(), r }); cur = [];
          if (r.black === C.pegs) return end(true);
          if (rows.length >= C.tries) return end(false);
          fb.className = 'feedback info'; fb.textContent = r.black + r.white === 0 ? 'Inga av de färgerna finns i koden.' : `${r.black} på rätt plats, ${r.white} rätt färg på fel plats.`;
          draw(); board.lastChild && board.lastChild.scrollIntoView({ block: 'nearest' });
        }
        function end(win) {
          over = true; draw();
          const pts = win ? Math.round((20 + (C.tries - rows.length + 1) * 10) * C.mult) : 0;
          const record = Hub.finishRound('logik', pts, { win, tries: rows.length });
          fb.textContent = '';
          stage.append(Hub.resultView({ emoji: win ? '🎯' : '🔐', title: win ? `Knäckt på ${rows.length} ${rows.length === 1 ? 'försök' : 'försök'}!` : 'Koden höll den här gången', text: win ? '' : 'Den hemliga koden visas överst.', points: pts, record, onAgain: start }));
        }
        draw();
        
      }
    },
  });

<script>
/* ==== js/games/siffror.js ==== */
/* Sifferpussel – Kakuro och Nonogram */
(function () {
  'use strict';
  const { el } = Hub;
  const KLVL = { familj: '1', ungdom: '2', vuxen: '3' };
  const NSIZE = { familj: 5, ungdom: 8, vuxen: 10 };
  const KPTS = { 1: 40, 2: 80, 3: 130 }, NPTS = { 5: 30, 8: 70, 10: 110 };

  /* ---------- Nonogram: generering med linjelösare (garanterar unik, logiskt lösbar bild) ---------- */
  const runsOf = (line) => { const r = []; let c = 0; for (const v of line) { if (v === 1) c++; else if (c) { r.push(c); c = 0; } } if (c) r.push(c); return r; };

    const n = known.length, can1 = Array(n).fill(false), can0 = Array(n).fill(false); let any = false;
    const cur = Array(n).fill(0);
    (function place(ci, pos) {
      if (ci === clue.length) {
        for (let i = pos; i < n; i++) if (known[i] === 1) return;
        for (let i = 0; i < n; i++) { if (i >= pos) cur[i] = 0; if (cur[i]) can1[i] = true; else can0[i] = true; }
        any = true; return;
      }
      const len = clue[ci], restMin = clue.slice(ci + 1).reduce((s, x) => s + x + 1, 0);
      for (let s = pos; s + len + restMin <= n; s++) {
        let ok = true;
        for (let i = pos; i < s; i++) if (known[i] === 1) { ok = false; break; }
        if (!ok) break;
        for (let i = s; i < s + len; i++) if (known[i] === 0) { ok = false; break; }
        if (ok && s + len < n && known[s + len] === 1) ok = false;
        if (!ok) continue;
        for (let i = pos; i < s; i++) cur[i] = 0;
        for (let i = s; i < s + len; i++) cur[i] = 1;
        if (s + len < n) cur[s + len] = 0;
        place(ci + 1, Math.min(n, s + len + 1));
      }
    })(0, 0);
    if (!any) return null;
    return known.map((v, i) => v !== -1 ? v : can1[i] && !can0[i] ? 1 : can0[i] && !can1[i] ? 0 : -1);
  }
  function lineSolve(rows, cols) {
    const R = rows.length, C = cols.length; const g = Array.from({ length: R }, () => Array(C).fill(-1));
    let changed = true;
    while (changed) {
      changed = false;
      for (let r = 0; r < R; r++) { const res = solveLine(rows[r], g[r]); if (!res) return null; res.forEach((v, c) => { if (g[r][c] !== v) { g[r][c] = v; changed = true; } }); }
      for (let c = 0; c < C; c++) { const res = solveLine(cols[c], g.map(x => x[c])); if (!res) return null; res.forEach((v, r) => { if (g[r][c] !== v) { g[r][c] = v; changed = true; } }); }
    }
    return g.every(row => row.every(v => v !== -1)) ? g : null;
  }
  function makeNonogram(n) {
    for (let t = 0; t < 400; t++) {
      const dens = 0.52 + Math.random() * 0.12;
      const sol = Array.from({ length: n }, () => Array.from({ length: n }, () => Math.random() < dens ? 1 : 0));
      const rows = sol.map(runsOf), cols = sol[0].map((_, c) => runsOf(sol.map(r => r[c])));

      const s = lineSolve(rows, cols);
      if (s && s.every((row, r) => row.every((v, c) => v === sol[r][c]))) return { sol, rows, cols };
    }
    return null;
  }
  Hub.nonogram = { makeNonogram, lineSolve, runsOf };

  Hub.register({
    id: 'siffror', title: 'Sifferpussel', emoji: '🔢', section: 'logik', c1: '#3a7bd5', c2: '#16b17e',
    desc: 'Kakuro – siffror som ska bli rätt summa – och Nonogram, där siffrorna avslöjar vilka rutor som ska fyllas.',
    progress: () => { const l = DATA.kakuro[KLVL[Hub.audience]]; return { done: l.filter((_, i) => Hub.isSolved('siffror', `kak-${KLVL[Hub.audience]}-${i}`)).length, of: l.length }; },
    meta: () => `✅ ${Hub.game('siffror').solved.filter(x => x.startsWith('kak-' + KLVL[Hub.audience])).length}/${DATA.kakuro[KLVL[Hub.audience]].length} kakuro`,
    mount(root) {
      const stage = el('div', { class: 'stage' }); root.append(stage);
      let mode = Hub.lsGet('ordagrant:sifferläge') === 'nono' ? 'nono' : 'kakuro';
      let lastK = -1, keyH = null;
      const onKey = (e) => keyH && keyH(e);
      document.addEventListener('keydown', onKey);
      this._stop = () => document.removeEventListener('keydown', onKey);
      show();
      function header() {
        return el('div', { class: 'row center', style: { marginBottom: '10px' } }, el('div', { class: 'seg', role: 'group', 'aria-label': 'Pusseltyp' },
          el('button', { type: 'button', 'aria-pressed': String(mode === 'kakuro'), onclick: () => { mode = 'kakuro'; Hub.lsSet('ordagrant:sifferläge', mode); show(); } }, '➕ Kakuro'),
          el('button', { type: 'button', 'aria-pressed': String(mode === 'nono'), onclick: () => { mode = 'nono'; Hub.lsSet('ordagrant:sifferläge', mode); show(); } }, '▦ Nonogram')));
      }
      function show() { keyH = null; if (mode === 'kakuro') kakuro(); else nono(); }

      /* ---------- Kakuro ---------- */
      function kakuro() {
        const lvl = KLVL[Hub.audience], list = DATA.kakuro[lvl];
        const idxs = list.map((_, i) => i).filter(i => i !== lastK);
        const fresh = idxs.filter(i => !Hub.isSolved('siffror', `kak-${lvl}-${i}`));
        const idx = (fresh.length ? fresh : idxs)[Hub.rand((fresh.length ? fresh : idxs).length)]; lastK = idx;
        const P = list[idx], R = P.p.length, C = P.p[0].length, id = `kak-${lvl}-${idx}`;
        const first = !Hub.isSolved('siffror', id);
        const val = P.giv.map(row => [...row].map(ch => /\d/.test(ch) ? +ch : 0));
        const fixed = P.giv.map(row => [...row].map(ch => /\d/.test(ch)));
        const clue = {}; P.clues.forEach(q => { const k = q.r + ',' + q.c; (clue[k] = clue[k] || {})[q.d] = q.s; });
        let sel = null, checks = 0, done = false;
        // första fria ruta
        outer: for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (P.p[r][c] === '.' && !fixed[r][c]) { sel = [r, c]; break outer; }
        const grid = el('div', { class: 'kk-grid', style: { gridTemplateColumns: `repeat(${C}, 1fr)`, maxWidth: Math.min(470, C * 62) + 'px' } });
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const pad = el('div', { class: 'kk-pad' }, [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => el('button', { type: 'button', onclick: () => put(d) }, d)), el('button', { type: 'button', class: 'er', onclick: () => put(0), 'aria-label': 'Sudda' }, '⌫'));
        const checkB = el('button', { class: 'btn small', type: 'button', onclick: check }, '🔍 Kontrollera (−10 p)');
        const newB = el('button', { class: 'btn small ghost', type: 'button', onclick: kakuro }, '🔄 Nytt pussel');
        stage.replaceChildren(header(),
          el('p', { class: 'muted center', style: { margin: '0 0 8px', fontSize: '14px' } }, 'Fyll i siffrorna 1–9 så att varje rad och kolumn får summan i rutan före. Samma siffra får inte förekomma två gånger i samma summa.'),
          grid, pad, fb, el('div', { class: 'row center' }, checkB, newB));
        function runCells(r, c, d) {
          const out = []; if (d === 'a') { let s = c; while (s > 0 && P.p[r][s - 1] === '.') s--; for (let x = s; x < C && P.p[r][x] === '.'; x++) out.push([r, x]); }
          else { let s = r; while (s > 0 && P.p[s - 1][c] === '.') s--; for (let y = s; y < R && P.p[y][c] === '.'; y++) out.push([y, c]); }
          return out;
        }
        function draw() {
          const hi = new Set(); if (sel) ['a', 'd'].forEach(d => runCells(sel[0], sel[1], d).forEach(([r, c]) => hi.add(r + ',' + c)));
          // fel i fullständiga summor
          const bad = new Set();
          P.clues.forEach(q => {
            const cells = q.d === 'a' ? Array.from({ length: q.n }, (_, i) => [q.r, q.c + 1 + i]) : Array.from({ length: q.n }, (_, i) => [q.r + 1 + i, q.c]);
            const vs = cells.map(([r, c]) => val[r][c]);
            const dupl = vs.filter(v => v).length !== new Set(vs.filter(v => v)).size;
            if (dupl || (vs.every(v => v) && vs.reduce((a, b) => a + b, 0) !== q.s)) cells.forEach(([r, c]) => bad.add(r + ',' + c));
          });
          grid.replaceChildren(...P.p.flatMap((row, r) => [...row].map((ch, c) => {
            const k = r + ',' + c;
            if (ch === '#') {
              const q = clue[k];
              if (!q) return el('div', { class: 'kk-cell blk' });
              return el('div', { class: 'kk-cell clue' + (q.d && q.a ? ' both' : ''), 'aria-label': (q.a ? `summa åt höger ${q.a}` : '') + (q.d ? ` summa nedåt ${q.d}` : '') },
                q.a ? el('span', { class: 'a' }, q.a) : null, q.d ? el('span', { class: 'd' }, q.d) : null);
            }
            const isSel = sel && sel[0] === r && sel[1] === c;
            return el('button', { type: 'button', class: 'kk-cell in' + (fixed[r][c] ? ' fix' : '') + (isSel ? ' sel' : hi.has(k) ? ' hi' : '') + (bad.has(k) ? ' bad' : '') + (val[r][c] && P.sol[r][c] === String(val[r][c]) && done ? ' good' : ''),
              'data-rc': k, 'aria-label': `Rad ${r} kolumn ${c}`, onclick: () => { if (!fixed[r][c] && !done) { sel = [r, c]; draw(); } } }, val[r][c] || '');
          })));
        }
        function put(d) {
          if (!sel || done) return; const [r, c] = sel; if (fixed[r][c]) return;

        function check() {

          fb.className = 'feedback ' + (wrong ? 'bad' : 'info'); fb.textContent = wrong ? `${wrong} ${wrong === 1 ? 'siffra är fel' : 'siffror är fel'}.` : 'Inga fel hittills!';
        }
        function win() {
          for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (P.p[r][c] === '.' && String(val[r][c]) !== P.sol[r][c]) return;
          done = true; sel = null; draw();
          let pts = Math.max(20, KPTS[lvl] - checks * 10); if (!first) pts = Math.round(pts / 2);
          Hub.markSolved('siffror', id);
          const record = Hub.finishRound('siffror', pts, { win: true, typ: 'kakuro' });
          stage.append(Hub.resultView({ emoji: '➕', title: 'Kakuro löst!', text: first ? '' : 'Det här pusslet hade du redan löst, så det ger halva poängen.', points: pts, record, onAgain: kakuro }));
        }

          else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { put(0); e.preventDefault(); }
          else if (e.key.startsWith('Arrow')) {
            const [dr, dc] = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
            let [r, c] = sel; for (;;) { r += dr; c += dc; if (r < 0 || c < 0 || r >= R || c >= C) break; if (P.p[r][c] === '.' && !fixed[r][c]) { sel = [r, c]; break; } }

          }

        draw();
        
      }

      /* ---------- Nonogram ---------- */
      function nono() {
        const n = NSIZE[Hub.audience], N = makeNonogram(n);
        const cell = Array.from({ length: n }, () => Array(n).fill(0)); // 0 tom, 1 fylld, 2 kryss
        let paint = 'fill', done = false, drag = null;
        const t0 = Date.now();
        const maxR = Math.max(...N.rows.map(r => r.length)), maxC = Math.max(...N.cols.map(c => c.length));
        const grid = el('div', { class: 'ng-grid', style: { gridTemplateColumns: `minmax(${Math.max(26, maxR * 14)}px, auto) repeat(${n}, 1fr)`, '--n': n } });
        const fb = el('div', { class: 'feedback', 'aria-live': 'polite' });
        const segP = el('div', { class: 'seg', role: 'group', 'aria-label': 'Verktyg' },
          el('button', { type: 'button', 'aria-pressed': 'true', onclick: (e) => setPaint('fill', e) }, '⬛ Fyll'),
          el('button', { type: 'button', 'aria-pressed': 'false', onclick: (e) => setPaint('cross', e) }, '✖ Kryss'));
        function setPaint(p, e) { paint = p; segP.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget))); }
        stage.replaceChildren(header(),
          el('p', { class: 'muted center', style: { margin: '0 0 8px', fontSize: '14px' } }, 'Siffrorna visar hur långa svarta block som finns i raden eller kolumnen, i ordning. Fyll rutorna så att alla stämmer. Dra med fingret för att fylla flera rutor, och använd Kryss för att markera rutor som ska vara tomma.'),
          el('div', { class: 'row center' }, segP), grid, fb,
          el('div', { class: 'row center' }, el('button', { class: 'btn small', type: 'button', onclick: () => { for (const r of cell) r.fill(0); draw(); } }, '🧽 Rensa'), el('button', { class: 'btn small ghost', type: 'button', onclick: nono }, '🔄 Ny bild')));

          for (let r = 0; r < n; r++) {
            grid.append(el('div', { class: 'ng-rc', 'data-r': r }, N.rows[r].map(v => el('span', null, v))));
            cells[r] = [];
            for (let c = 0; c < n; c++) { const b = el('div', { class: 'ng-cell', 'data-r': r, 'data-c': c, role: 'button', 'aria-label': `Rad ${r + 1} kolumn ${c + 1}` }); if (c % 5 === 4 && c < n - 1) b.classList.add('br'); if (r % 5 === 4 && r < n - 1) b.classList.add('bb'); cells[r][c] = b; grid.append(b); }
          }
        }
        function draw() {
          for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) cells[r][c].className = 'ng-cell' + (c % 5 === 4 && c < n - 1 ? ' br' : '') + (r % 5 === 4 && r < n - 1 ? ' bb' : '') + (cell[r][c] === 1 ? ' on' : cell[r][c] === 2 ? ' x' : '');

          for (let r = 0; r < n; r++) { const ok = eq(runsOf(cell[r]), N.rows[r]); grid.querySelector(`.ng-rc[data-r="${r}"]`).classList.toggle('ok', ok); all = all && ok; }
          for (let c = 0; c < n; c++) { const ok = eq(runsOf(cell.map(x => x[c])), N.cols[c]); grid.querySelector(`.ng-cc[data-c="${c}"]`).classList.toggle('ok', ok); all = all && ok; }

          e.preventDefault(); drag = { v: target(+t.dataset.r, +t.dataset.c) }; apply(t);
        });
        grid.addEventListener('pointermove', (e) => {
          if (!drag || done) return;
          const t = document.elementFromPoint(e.clientX, e.clientY); const c = t && t.closest && t.closest('.ng-cell');
          if (c && grid.contains(c)) apply(c);
        });
        const up = () => { drag = null; };
        grid.addEventListener('pointerup', up); grid.addEventListener('pointercancel', up); grid.addEventListener('pointerleave', up);
        // Hindra att webbläsaren tolkar dragningen som en egen gest (annars kan nästa tryck tappas bort på Android)
        grid.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        grid.addEventListener('touchend', (e) => { if (e.cancelable) e.preventDefault(); up(); }, { passive: false });
        function win() {
          done = true;
          for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (cell[r][c] === 2) cell[r][c] = 0;
          grid.classList.add('won'); for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) cells[r][c].className = 'ng-cell' + (cell[r][c] === 1 ? ' on' : '');
          const sec = (Date.now() - t0) / 1000;
          const pts = Math.max(Math.round(NPTS[n] / 2), NPTS[n] - Math.floor(sec / 30) * 5);
          Hub.markSolved('siffror', 'nono-' + n + '-' + Date.now());
          const record = Hub.finishRound('siffror', pts, { win: true, typ: 'nonogram' });
          fb.className = 'feedback ok'; fb.textContent = `Bilden är klar på ${Hub.fmtTime(sec)}!`;
          stage.append(Hub.resultView({ emoji: '▦', title: 'Nonogram löst!', text: '', points: pts, record, onAgain: nono }));
        }
        build(); draw();
        
      }
    },
    unmount() { if (this._stop) this._stop(); },
  });
})();

<script>
/* ==== js/games/utmaning.js ==== */
/* Dagens utmaning – tre små uppdrag per dag ur de andra spelen, med streak och märken */
(function () {
  'use strict';

  const POOL = [

    { game: 'pussel', t: () => 'Lös 15-pusslet', ok: round('pussel', () => true) },
    { game: 'memory', t: () => 'Klara en omgång Memory', ok: round('memory', () => true) },
    { game: 'snake', t: () => `Få minst ${lvl(30, 50, 70)} poäng i Snake`, ok: round('snake', ev => ev.points >= lvl(30, 50, 70)) },
    { game: 'mullvad', t: () => `Få minst ${lvl(60, 90, 120)} poäng i Slå mullvaden`, ok: round('mullvad', ev => ev.points >= lvl(60, 90, 120)) },
    { game: 'ordblandning', t: () => `Få minst ${lvl(60, 80, 100)} poäng i Ordblandning`, ok: round('ordblandning', ev => ev.points >= lvl(60, 80, 100)) },
    { game: 'ordjakt', t: () => 'Hitta alla ord i en Ordjakt', ok: round('ordjakt', ev => ev.points >= 20 && !!ev.info.all) },
    { game: 'hanga', t: () => 'Vinn en omgång Hänga gubbe', ok: round('hanga', ev => ev.points > 0) },
    { game: 'ordsprak', t: () => `Få minst ${lvl(50, 70, 90)} poäng i Ordspråksluckan`, ok: round('ordsprak', ev => ev.points >= lvl(50, 70, 90)) },
    { game: 'vem', t: () => `Få minst ${lvl(80, 100, 120)} poäng i Vem är jag?`, ok: round('vem', ev => ev.points >= lvl(80, 100, 120)) },
    { game: 'ordkedja', t: () => `Bilda minst ${lvl(4, 6, 6)} egna ord i en Ordkedja`, ok: round('ordkedja', ev => ev.info.words >= lvl(4, 6, 6)) },
    { game: 'synonymer', t: () => 'Klara en omgång Synonymer och motsatser', ok: round('synonymer', () => true) },
    { game: 'kopplingen', t: () => 'Lös en Kopplingen', ok: round('kopplingen', ev => !!ev.info.win) },
    { game: 'logik', t: () => 'Knäck koden i Logiktavlan', ok: round('logik', ev => !!ev.info.win) },
    { game: 'siffror', t: () => 'Lös ett kakuro eller nonogram', ok: round('siffror', ev => !!ev.info.win) },
    { game: 'bokstav', t: () => `Hitta minst ${lvl(6, 10, 12)} ord i dagens Bokstavsbygget`, ok: (ev) => ev.type === 'event' && ev.id === 'bokstav' && ev.info.daily && ev.info.found >= lvl(6, 10, 12) },
  ];
  const BADGES = [[3, '🥉', '3 dagar i rad'], [7, '🥈', 'En hel vecka'], [14, '🥇', 'Två veckor'], [30, '🏆', 'En hel månad'], [100, '💎', '100 dagar']];
  function tasksFor(day) {

    const p = POOL.filter(t => Hub.games.some(g => g.id === t.game));

  Hub.register({

        root.replaceChildren(el('div', { class: 'stage' },
          el('div', { class: 'ut-head' },
            el('div', null, el('div', { class: 'muted' }, date), el('h2', { style: { margin: '2px 0 0' } }, st.complete ? '🎉 Alla uppdrag klara!' : `${st.done.filter(Boolean).length} av 3 uppdrag klara`)),
            el('div', { class: 'ut-streak', title: 'Dagar i rad' }, el('b', null, '🔥 ' + streak), el('small', null, streak === 1 ? 'dag i rad' : 'dagar i rad'))),
          el('div', { class: 'ut-tasks' }, tasks.map((t, i) => {

              el('span', { class: 'ut-check', 'aria-hidden': 'true' }, st.done[i] ? '✔' : i + 1),
              el('span', { class: 'ut-text' }, el('b', null, t.t()), el('small', null, g.emoji + ' ' + g.title)),

          })),

          el('div', { class: 'ut-badges' }, BADGES.map(([n, e, txt]) => el('div', { class: 'ut-badge' + (st.badges.includes(n) ? ' got' : '') }, el('span', { class: 'e' }, e), el('b', null, txt), el('small', null, st.badges.includes(n) ? 'Upplåst!' : `${n} dagar i rad`))))));

(function () {

  function buildQuestions(n, types) {
    const L = Hub.levels();

    const pool = (list) => Hub.shuffle(list.filter(q => !L.includes(q.lvl))).concat(Hub.shuffle(list.filter(q => L.includes(q.lvl))));
    const quiz = pool(DATA.quiz), sf = pool(DATA.santfalskt), gator = pool(DATA.gator);
    const allG = DATA.gator.map(g => g.a[0]);

      quiz: () => { const q = quiz.pop(); return { typ: 'quiz', q: q.q, opts: Hub.shuffle([q.a, ...q.w]), a: q.a, f: q.f }; },
      sf: () => { const q = sf.pop(); return { typ: 'sf', q: q.s, opts: ['Sant', 'Falskt'], a: q.a ? 'Sant' : 'Falskt', f: q.f }; },
      gata: () => {

        const typeBox = el('div', { class: 'row center' }, Object.entries(TYPES).map(([k, v]) => el('button', { type: 'button', class: 'btn small' + (types.has(k) ? ' on' : ''), 'aria-pressed': String(types.has(k)), onclick: (e) => {

          el('p', { class: 'muted center', style: { marginTop: 0 } }, 'Ni turas om att svara på samma telefon. Lämna över när det är den andras tur! Snabba rätta svar ger bonuspoäng.'),

          el('p', { style: { margin: '14px 0 6px', fontWeight: '700' } }, 'Frågor per spelare'), segN,
          el('p', { style: { margin: '14px 0 6px', fontWeight: '700' } }, 'Frågetyper'), typeBox,
          el('div', { class: 'row center', style: { marginTop: '18px' } }, el('button', { class: 'btn primary', id: 'du-start', onclick: () => {

            el('div', { class: 'timer', style: { marginTop: '10px' } }, bar), el('div', { class: 'quiz-q' }, q.q), opts, fb, next);
          tick = setInterval(() => { left -= 0.1; bar.style.width = Math.max(0, left / TIME * 100) + '%'; bar.style.backgroundPosition = (100 - left / TIME * 100) + '% 0'; if (left <= 0) pick(null, false, true); }, 100);

  Hub.start();
})();
