        el('p', { class: 'muted center', style: { fontSize: '13px' } }, 'Brun mullvad: +10 · Guldmullvad: +30 · Bomb: −20')));
      function upd() { info.textContent = `⏱️ ${Math.ceil(left ?? DUR)} s · ⭐ ${score ?? 0} p · 🏆 ${Hub.game('mullvad').best} p`; }
      function start() {

        const t0 = Date.now();

        spawn(); setTimeout(spawn, 400); upd();
      }

          m.kind = r < 0.12 ? 'gold' : r < 0.27 ? 'bomb' : 'mole'; m.up = true;
          m.el.className = 'mole ' + (m.kind === 'mole' ? '' : m.kind);
          m.el.innerHTML = m.kind === 'bomb' ? '💣' : '<div class="body"><div class="nose"></div></div>';
          requestAnimationFrame(() => m.el.classList.add('up'));
          timers.push(setTimeout(() => down(k), T.up * speedUp * (m.kind === 'gold' ? 0.7 : 1)));
        }
        timers.push(setTimeout(spawn, (T.gap + Math.random() * T.gap) * speedUp));
      }
      function down(k) { const m = moles[k]; m.up = false; m.el.classList.remove('up'); }
      function whack(k) {
        const m = moles[k]; if (!running || !m.up || m.el.classList.contains('hit')) return;
        const pts = m.kind === 'gold' ? 30 : m.kind === 'bomb' ? -20 : 10;
        score = Math.max(0, score + pts); if (pts > 0) hits++;
        m.el.classList.add('hit'); m.el.append(el('span', { class: 'stars' }, pts > 0 ? '💫' : '💥'));
        setTimeout(() => down(k), 180); upd();
      }
      function end() {
        running = false; clearInterval(tickI); timers.forEach(clearTimeout); timers = []; moles.forEach((m, k) => down(k));
        left = 0; btn.disabled = false; btn.textContent = '🔄 Spela igen';
        const record = Hub.finishRound('mullvad', score); upd();
        fb.replaceChildren(Hub.resultView({ emoji: '🔨', title: 'Tiden är ute!', text: `Du träffade ${hits} gånger.`, points: score, record, onAgain: start }));
      }
      this._cleanup = () => { running = false; clearInterval(tickI); timers.forEach(clearTimeout); };
      upd();
    },
    unmount() { this._cleanup && this._cleanup(); },
  });
})();

</script>
<script>
/* ==== js/menu.js ==== */
/* Startmeny */
(function () {
  'use strict';
  const { el } = Hub;
  const SECTIONS = [
    ['ord', '📚 Ord och kunskap'],
    ['logik', '🧠 Logik och pussel'],
    ['sma', '⚡ Snabba småspel'],
  ];
  Hub.renderMenu = function (app) {
    const st = Hub.stats();
    const played = Hub.games.filter(g => Hub.game(g.id).plays > 0 || Hub.game(g.id).solved.length > 0).length;
    app.append(
      el('section', { class: 'hero' },
        el('h1', null, 'Välkommen till ', el('span', { class: 'grad' }, 'ORDAGRANT')),
        el('p', null, 'Quiz, gåtor, rebusar, korsord, sudoku och småspel – på svenska, för hela familjen. Samla poäng och slå dina egna rekord!')),
      el('div', { class: 'dash' },
        tile(Hub.fmt(st.total), 'Totalpoäng'),
        tile(Hub.totalSolved(), 'Lösta uppgifter'),
        tile(st.rounds, 'Spelade omgångar'),
        tile(`${played}/${Hub.games.length}`, 'Testade spel')),
      audienceBox(),
      ...SECTIONS.map(([key, title]) => {
        const games = Hub.games.filter(g => g.section === key);
        return el('div', null, el('h2', { class: 'section-title' }, title),
          el('div', { class: 'cards' }, games.map((g, k) => card(g, k))));
      }),
      Hub.persistent ? null : el('p', { class: 'center', style: { color: 'rgba(255,255,255,.75)', fontSize: '14px', marginTop: '22px' } }, 'ℹ️ Webbläsaren tillåter inte lagring här, så poängen sparas bara tills sidan stängs.'),
      el('div', { class: 'menu-actions' }, el('button', { class: 'btn btn-danger', onclick: reset }, '🗑️ Nollställ alla poäng')));
  };
  function tile(v, l) { return el('div', { class: 'dtile' }, el('div', { class: 'v' }, v), el('div', { class: 'l' }, l)); }
  function audienceBox() {
    const opts = Object.values(Hub.AUDIENCES).map(a => el('button', {
      class: 'aud-opt', type: 'button', 'aria-pressed': String(Hub.audience === a.id),
      onclick: () => { Hub.setAudience(a.id); Hub.toast(`${a.emoji} Målgrupp: ${a.name}`); const app = document.getElementById('app'); const y = window.scrollY; app.innerHTML = ''; Hub.renderMenu(app); window.scrollTo(0, y); }
    }, el('span', { class: 'e' }, a.emoji), el('span', null, el('b', null, a.name), el('small', null, a.desc))));
    return el('section', { class: 'aud-box', 'aria-labelledby': 'aud-h' },
      el('h2', { id: 'aud-h' }, 'Vem spelar?'),
      el('p', { class: 'sub' }, 'Välj målgrupp – frågor, gåtor, rebusar, ordblandning och svårighetsgrader anpassas efter valet. Allt innehåll passar alla åldrar.'),
      el('div', { class: 'aud-options', role: 'group', 'aria-label': 'Målgrupp' }, opts));
  }
  function card(g, k) {
    const s = Hub.game(g.id);
    const p = g.progress ? g.progress() : null;
    return el('a', { class: 'card', href: '#/' + g.id, style: { '--c1': g.c1, '--c2': g.c2, animationDelay: (k * 0.05) + 's' }, 'aria-label': `${g.title}: ${g.desc}` },
      el('div', { class: 'emoji', 'aria-hidden': 'true' }, g.emoji),
      el('h3', null, g.title),
      el('p', null, g.desc),
      p ? el('div', { class: 'bar', title: `${p.done} av ${p.of} lösta` }, el('i', { style: { width: (p.of ? p.done / p.of * 100 : 0) + '%' } })) : null,
      el('div', { class: 'meta' },
        el('span', null, p ? `✅ ${p.done}/${p.of} lösta` : `🎮 ${s.plays} ${s.plays === 1 ? 'omgång' : 'omgångar'}`),
        el('span', null, `🏆 ${Hub.fmt(s.best)} p`)));
  }
  async function reset() {
    if (await Hub.confirm('Nollställa allt?', 'Alla poäng, rekord och lösta uppgifter raderas från den här webbläsaren. Det går inte att ångra.', 'Ja, nollställ')) {
      Hub.reset(); Hub.toast('Alla poäng är nollställda.');
      const app = document.getElementById('app'); app.innerHTML = ''; Hub.renderMenu(app);
    }
  }
  Hub.start();
})();

</script>
